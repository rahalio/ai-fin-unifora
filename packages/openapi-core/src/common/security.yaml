openapi: 3.1.0
info:
  title: Shared security schemes
  version: 0.1.0
  description: API-key auth for tenant-scoped APIs (tenant implied by key).
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Tenant API key. Implies tenant isolation — no cross-tenant reads.
        Used by catalogue/pipeline connectors and machine integrations.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Operator Bearer JWT for data/AI console sessions.
        Issued via identity `/v0/auth/*` stubs.
