openapi: 3.1.0
info:
  title: Audits API
  version: 0.1.0
  description: |
    Examiner packs — dataset access, sharing decisions, and pipeline
    changes exported for regulatory lookback.
  license:
    name: Proprietary
    url: https://unifora.local/license
  x-domain: aud
servers:
  - url: https://api.unifora.local
    description: Local / starter API
security:
  - bearerAuth: []
tags:
  - name: Audits
    description: Audit exports
paths:
  /v1/audits/exports:
    post:
      operationId: createUniforaAuditExport
      tags: [Audits]
      summary: Create an audit export job
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./audits.schemas.yaml#/components/schemas/AuditExportCreateRequest
      responses:
        '201':
          description: Export job created
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AuditExportResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/audits/exports/{auditExportId}:
    get:
      operationId: getAuditExport
      tags: [Audits]
      summary: Get audit export job status
      parameters:
        - name: auditExportId
          in: path
          required: true
          schema:
            $ref: ./audits.schemas.yaml#/components/schemas/AuditExportId
      responses:
        '200':
          description: Audit export
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AuditExportResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
