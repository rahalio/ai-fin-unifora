openapi: 3.0.3
info:
  title: Unifora
  version: 0.1.0
  description: >-
    ai-readiness data unification ops play with share workflows, readiness scoring, pipeline SLAs, and quarter TTV gates.
  x-product-slug: ai-fin-unifora
  x-source: ai-in-financial/the-ai-revolution-finextra-v2-paper/
servers:
  - url: https://api.example.com
tags:
  - name: UseCases
    description: AI use cases and TTV gates
  - name: DataProducts
    description: Stewarded data products
  - name: Shares
    description: Internal and third-party share requests
  - name: Readiness
    description: Finextra checklist readiness scores
  - name: Pipelines
    description: Model pipeline ops registry
  - name: Escalations
    description: Silo dispute escalations
  - name: Lineage
    description: Lineage graphs
  - name: Audits
    description: Audit exports
paths:
  /v1/use-cases:
    get:
      operationId: listUseCases
      tags: [UseCases]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeUseCase"
    post:
      operationId: createUseCase
      tags: [UseCases]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseCaseCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeUseCase"
  /v1/use-cases/{useCaseId}:
    parameters:
      - $ref: "#/components/parameters/UseCaseId"
    get:
      operationId: getUseCase
      tags: [UseCases]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeUseCase"
  /v1/use-cases/{useCaseId}/ttv-gates:
    parameters:
      - $ref: "#/components/parameters/UseCaseId"
    put:
      operationId: setTTVGate
      tags: [UseCases]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TTVGateUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeUseCase"
  /v1/data-products:
    get:
      operationId: listDataProducts
      tags: [DataProducts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDataProduct"
    post:
      operationId: createDataProduct
      tags: [DataProducts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataProductCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDataProduct"
  /v1/shares:
    get:
      operationId: listShareRequests
      tags: [Shares]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeShareRequest"
    post:
      operationId: createShareRequest
      tags: [Shares]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareRequestCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeShareRequest"
  /v1/shares/{shareRequestId}/decide:
    parameters:
      - $ref: "#/components/parameters/ShareRequestId"
    post:
      operationId: decideShareRequest
      tags: [Shares]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareDecision"
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeShareRequest"
  /v1/readiness/{useCaseId}:
    parameters:
      - $ref: "#/components/parameters/UseCaseId"
    get:
      operationId: getReadinessScore
      tags: [Readiness]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReadinessScore"
    post:
      operationId: recomputeReadiness
      tags: [Readiness]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReadinessScore"
  /v1/pipelines:
    get:
      operationId: listPipelines
      tags: [Pipelines]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePipeline"
    post:
      operationId: registerPipeline
      tags: [Pipelines]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePipeline"
  /v1/pipelines/{pipelineId}/sla-events:
    parameters:
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: recordPipelineSLAEvent
      tags: [Pipelines]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineSLAEvent"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePipeline"
  /v1/escalations:
    get:
      operationId: listEscalations
      tags: [Escalations]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeEscalationCase"
    post:
      operationId: openEscalation
      tags: [Escalations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationCaseCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEscalationCase"
  /v1/lineage/{dataProductId}:
    parameters:
      - $ref: "#/components/parameters/DataProductId"
    get:
      operationId: getLineage
      tags: [Lineage]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLineageGraph"
  /v1/audits/exports:
    post:
      operationId: createUniforaAuditExport
      tags: [Audits]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAuditExport"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    UseCaseId:
      name: useCaseId
      in: path
      required: true
      schema: { type: string }
    ShareRequestId:
      name: shareRequestId
      in: path
      required: true
      schema: { type: string }
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema: { type: string }
    DataProductId:
      name: dataProductId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    UseCase:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [proposed, ready, building, live, stalled] }
        wranglingTimeShare: { type: number }
        ttvDueAt: { type: string, format: date-time }
        ttvHit: { type: boolean }
    UseCaseCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        domain: { type: string }
        sponsor: { type: string }
    TTVGateUpdate:
      type: object
      required: [ttvDueAt]
      properties:
        ttvDueAt: { type: string, format: date-time }
        targetWranglingShare: { type: number }
    DataProduct:
      type: object
      required: [id, name, stewardId]
      properties:
        id: { type: string }
        name: { type: string }
        stewardId: { type: string }
        siloSystemCount: { type: integer }
        qualityStatus: { type: string, enum: [green, amber, red] }
    DataProductCreate:
      type: object
      required: [name, stewardId]
      properties:
        name: { type: string }
        stewardId: { type: string }
        description: { type: string }
    ShareRequest:
      type: object
      required: [id, dataProductId, status, shareScope]
      properties:
        id: { type: string }
        dataProductId: { type: string }
        useCaseId: { type: string }
        shareScope: { type: string, enum: [internal, thirdParty] }
        purpose: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        decisionRationale: { type: string }
    ShareRequestCreate:
      type: object
      required: [dataProductId, shareScope, purpose]
      properties:
        dataProductId: { type: string }
        useCaseId: { type: string }
        shareScope: { type: string, enum: [internal, thirdParty] }
        purpose: { type: string }
    ShareDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny] }
        rationale: { type: string }
    ReadinessScore:
      type: object
      required: [useCaseId, score]
      properties:
        useCaseId: { type: string }
        score: { type: number }
        siloRemovalProgress: { type: number }
        lineageCoverage: { type: number }
        pipelineOpsReady: { type: boolean }
        checklist: { type: object, additionalProperties: true }
    Pipeline:
      type: object
      required: [id, name, owner, status]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { type: string }
        useCaseId: { type: string }
        status: { type: string, enum: [registered, production, breached, retired] }
        sla: { type: string }
    PipelineCreate:
      type: object
      required: [name, owner]
      properties:
        name: { type: string }
        owner: { type: string }
        useCaseId: { type: string }
        sla: { type: string }
    PipelineSLAEvent:
      type: object
      required: [eventType]
      properties:
        eventType: { type: string, enum: [ok, breach, patched] }
        detail: { type: string }
    EscalationCase:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        shareRequestId: { type: string }
        status: { type: string, enum: [open, resolved] }
        deadlineAt: { type: string, format: date-time }
        resolution: { type: string }
    EscalationCaseCreate:
      type: object
      required: [shareRequestId, deadlineAt]
      properties:
        shareRequestId: { type: string }
        deadlineAt: { type: string, format: date-time }
        reason: { type: string }
    LineageGraph:
      type: object
      required: [dataProductId]
      properties:
        dataProductId: { type: string }
        nodes: { type: array, items: { type: object, additionalProperties: true } }
        edges: { type: array, items: { type: object, additionalProperties: true } }
    AuditExport:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, ready, failed] }
        downloadUri: { type: string, format: uri }
    AuditExportCreate:
      type: object
      required: [periodFrom, periodTo]
      properties:
        periodFrom: { type: string, format: date-time }
        periodTo: { type: string, format: date-time }

    DataEnvelopeUseCase:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/UseCase"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeUseCase:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UseCase"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeDataProduct:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DataProduct"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeDataProduct:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DataProduct"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeShareRequest:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ShareRequest"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeShareRequest:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ShareRequest"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeReadinessScore:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ReadinessScore"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeReadinessScore:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReadinessScore"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopePipeline:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Pipeline"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopePipeline:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Pipeline"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeEscalationCase:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/EscalationCase"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeEscalationCase:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EscalationCase"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeLineageGraph:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/LineageGraph"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeLineageGraph:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LineageGraph"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeAuditExport:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AuditExport"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeAuditExport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditExport"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"

